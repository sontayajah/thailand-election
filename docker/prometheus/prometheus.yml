global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "election-api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: "election-worker"
    static_configs:
      - targets: ["worker:8082"]
    metrics_path: /metrics

  - job_name: "centrifugo"
    static_configs:
      - targets: ["centrifugo:8001"]
    metrics_path: /metrics
