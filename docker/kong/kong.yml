_format_version: "3.0"
_transform: true

# ─────────────────────────────────────────────────────────────
# Kong Declarative Config — Thailand Election API Gateway
# Routes mirror PRD §2.4.1
# ─────────────────────────────────────────────────────────────

services:
  # ── Public Reporting API ─────────────────────────────────────
  - name: reporting-api
    url: http://api:8080
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: reporting-routes
        paths:
          - /api/v1/election
          - /api/v1/provinces
          - /api/v1/candidates
          - /api/v1/parties
          - /api/v1/health
          - /api/v1/realtime
        strip_path: false
        methods: [GET, POST, OPTIONS]
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: redis
          redis_host: redis-cache
          redis_port: 6379
          redis_password: redis_cache_pass
          error_message: "Rate limit exceeded. Max 300 requests per minute."
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:80"
          methods: [GET, POST, OPTIONS]
          headers: [Accept, Authorization, Content-Type, X-Request-ID]
          max_age: 3600

  # ── Online Voting API ─────────────────────────────────────────
  - name: voting-api
    url: http://api:8080
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: voting-auth-routes
        paths:
          - /api/v1/online-voting/auth
        strip_path: false
        methods: [POST, OPTIONS]
      - name: voting-routes
        paths:
          - /api/v1/online-voting
        strip_path: false
        methods: [GET, POST, OPTIONS]
    plugins:
      - name: rate-limiting
        config:
          minute: 10
          policy: redis
          redis_host: redis-cache
          redis_port: 6379
          redis_password: redis_cache_pass
          error_message: "Rate limit exceeded for voting API."
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
          methods: [GET, POST, OPTIONS]
          headers: [Accept, Authorization, Content-Type, X-Request-ID, X-Idempotency-Key]
          max_age: 3600
      - name: bot-detection

  # ── Physical Vote Ingestion ───────────────────────────────────
  - name: ingestion-api
    url: http://api:8080
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: ingestion-route
        paths:
          - /api/v1/votes
        strip_path: false
        methods: [POST, OPTIONS]
    plugins:
      - name: key-auth
        config:
          key_names: [X-API-Key]
          hide_credentials: false
      - name: rate-limiting
        config:
          minute: 500
          policy: redis
          redis_host: redis-cache
          redis_port: 6379
          redis_password: redis_cache_pass
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  # ── Admin API ─────────────────────────────────────────────────
  - name: admin-api
    url: http://api:8080
    routes:
      - name: admin-routes
        paths:
          - /api/v1/admin
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          secret_is_base64: false
          key_claim_name: iss
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis_host: redis-cache
          redis_port: 6379
          redis_password: redis_cache_pass
      - name: ip-restriction
        config:
          allow:
            - "127.0.0.1"
            - "::1"
            - "172.16.0.0/12"
            - "10.0.0.0/8"

consumers:
  - username: election-officer-default
    keyauth_credentials:
      - key: dev-api-key-election-officer
